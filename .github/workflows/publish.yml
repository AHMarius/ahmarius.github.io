name: Build & publish static site

on:
  push:
    branches:
      - main
  schedule:
    # Rebuild a few times a day so future-dated posts (front-matter `date`)
    # appear automatically even when the editor is offline.
    - cron: '0 6,12,18,0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This is a Node-only static-site build. Do not add ruby/setup-ruby or
      # `bundle install` here: the repository no longer ships a Jekyll site or
      # a Gemfile.lock, and doing so reintroduces Bundler lockfile failures.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint content + frontmatter schema
        run: npm run lint

      - name: Run the test suite
        run: npm test

      - name: Build site (publish)
        run: npm run build -- --mode publish

      - name: Guard against draft leaks in published output
        run: node scripts/check-leaks.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
