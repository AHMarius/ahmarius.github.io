title: "DIGITAL CV"
description: "Portfolio and devlog."
url: "https://ahmarius.github.io"
baseurl: ""

timezone: Europe/Bucharest

future: false

permalink: /devlog/:slug/

markdown: kramdown
kramdown:
  auto_ids: true
  syntax_highlighter: rouge

collections:
  hubs:
    output: true
    permalink: /pages/:slug/
  projects:
    output: true
    permalink: /projects/:slug/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      og_article: true
  - scope:
      path: ""
      type: hubs
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - node_modules
  - scripts
  - admin-app
  - dist
  - content
  - .github
  - feed.xml
  - atom.xml
  - sitemap.xml
  - assets/og
  - ADMIN_APP_BUILD_PROMPT(1).md
  - vite.config.ts
  - package.json
  - package-lock.json
  - README.md
  - .idea