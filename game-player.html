<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browser game player for Alexandru-Marius Hrițcu projects.">
    <title>Game Player — Alexandru-Marius Hrițcu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<a class="skip-link" href="#main-content">Skip to main content</a>

<video
    autoplay
    muted
    loop
    playsinline
    disablepictureinpicture
    id="bgVideo"
    poster="video-poster.jpg"
    controlslist="nodownload noplaybackrate noremoteplayback">
    <source src="video.mp4" type="video/mp4">
</video>

<nav aria-label="Primary navigation" class="topnav">
    <div class="topnav-inner">
        <span class="site-logo">DIGITAL CV</span>

        <button
            aria-controls="mobile-menu"
            aria-expanded="false"
            aria-label="Toggle menu"
            class="hamburger-btn"
            id="hamburger-btn">
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
        </button>
    </div>

    <ul class="mobile-menu" hidden id="mobile-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="games.html">Games</a></li>
    </ul>
</nav>

<main class="game-player-page" id="main-content">
    <header class="game-player-header">
        <div>
            <span class="section-eyebrow">Browser player</span>
            <h1 id="game-title">Loading game…</h1>
            <p id="game-description"></p>
        </div>

        <div class="game-player-actions">
            <a class="link-btn" href="games.html">All games</a>

            <a
                class="link-btn"
                hidden
                href="#"
                id="game-external-link"
                rel="noopener noreferrer"
                target="_blank">
                Open project
            </a>
        </div>
    </header>

    <section aria-label="Game viewport" class="game-stage-shell">
        <div class="game-stage" id="game-stage">
            <div class="game-stage-loading" id="game-loading">
                Preparing browser player…
            </div>
        </div>
    </section>
</main>

<script>
    const GAME_CONFIG = {
        justdrive: {
            title: "2D Racing Game",
            description: "C++ / SDL2 Emscripten WebAssembly build.",
            type: "browser",
            index: "games/justdrive/index.html"
        },

        racing: {
            title: "2D Racing Game",
            description: "C++ / SDL2 Emscripten WebAssembly build.",
            type: "browser",
            index: "games/justdrive/index.html"
        },

        ironhalo: {
            title: "IronHalo",
            description: "Java desktop build. A browser-compatible runtime is not currently available on GitHub Pages.",
            type: "desktop",
            external: "https://github.com/AHMarius/IronHalo"
        }
    };

    const key =
        new URLSearchParams(window.location.search).get("game") || "justdrive";

    const game = GAME_CONFIG[key] || GAME_CONFIG.justdrive;

    const title = document.getElementById("game-title");
    const description = document.getElementById("game-description");
    const stage = document.getElementById("game-stage");
    const loading = document.getElementById("game-loading");
    const externalLink = document.getElementById("game-external-link");

    document.title = `${game.title} — Game Player`;
    title.textContent = game.title;
    description.textContent = game.description;

    /*
     * Browser builds:
     * Load only the game's own index.html. That index is responsible for
     * loading its JS/WASM/data assets.
     */
    if (game.type === "browser") {
        const frame = document.createElement("iframe");

        frame.className = "game-frame";
        frame.src = game.index;
        frame.title = `${game.title} playable game`;
        frame.allow = "autoplay; fullscreen; gamepad; pointer-lock";
        frame.allowFullscreen = true;
        frame.loading = "eager";
        frame.setAttribute("referrerpolicy", "no-referrer");

        frame.addEventListener("load", () => {
            loading.remove();
        });

        frame.addEventListener("error", () => {
            loading.textContent =
                `The browser build could not be loaded from ${game.index}.`;
        });

        stage.appendChild(frame);
    }

    /*
     * Desktop-only projects:
     * Never request a nonexistent browser URL. Render a branded explanation
     * and provide a real project link instead.
     */
    if (game.type === "desktop") {
        loading.remove();

        const fallback = document.createElement("div");
        fallback.className = "game-stage-fallback";

        fallback.innerHTML = `
            <span class="section-eyebrow">Desktop build</span>
            <h2>IronHalo is not available in the browser yet.</h2>
            <p>
                This project currently exists as a Java desktop build.
                There is no <code>games/ironhalo/index.html</code> browser
                build on the site, so this page will not attempt to load a
                missing file or show a GitHub Pages 404.
            </p>
            <a
                class="link-btn game-play-button"
                href="${game.external}"
                target="_blank"
                rel="noopener noreferrer">
                View IronHalo on GitHub
            </a>
        `;

        stage.appendChild(fallback);

        externalLink.href = game.external;
        externalLink.textContent = "GitHub";
        externalLink.hidden = false;
    }
</script>

<script src="script.js"></script>
</body>
</html>
