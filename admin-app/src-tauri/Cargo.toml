[package]
name = "ahmarius-content-studio"
version = "1.0.0"
description = "Native content studio for ahmarius.github.io"
authors = ["Alexandru-Marius Hrițcu"]
edition = "2021"
default-run = "ahmarius-content-studio"

[lib]
name = "ahmarius_content_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
