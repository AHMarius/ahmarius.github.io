[package]
name = "ahmarius-content-studio"
version = "1.0.0"
description = "Native content studio for ahmarius.github.io"
authors = ["Alexandru-Marius Hrițcu"]
edition = "2021"
default-run = "ahmarius-content-studio"

[lib]
name = "ahmarius_content_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
thiserror = "2.0.0"
chrono = "0.4.0"
reqwest = { version = "0.12.0", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10.0"
percent-encoding = "2.0.0"
base64 = "0.22.0"
dirs = "7.0.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
